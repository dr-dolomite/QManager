[package]
name = "qmanager_atd"
version = "0.8.0"
edition = "2021"
description = "QManager AT broker: owns /dev/smd11, serialises AT commands, and is the qcmd client; also the qmanager_logd journal daemon"
publish = false

[dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
